<head>

  <title>Thanks for subscribing | ElevareFit</title>
  <style>
    body {
      margin: 0;

      height: 100dvh;

      color: #f1f7f5;
      font-family: "Segoe UI", sans-serif;

    .card {
      width: min(560px, 92vw);

    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 8px 0; color: #a8bbb6; }
    a {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      color: #04110e;
      background: #18d5b0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're subscribed.</h1>
    <p>Thanks for signing up for <strong>Elevare</strong> updates.</p>
