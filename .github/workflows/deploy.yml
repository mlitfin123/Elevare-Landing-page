name: Validate website build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Typecheck
        working-directory: website
        run: npm run typecheck

      - name: Test
        working-directory: website
        run: npm test

      - name: Build static site
        working-directory: website
        run: npm run build
        env:
          SUPABASE_URL: ${{ vars.LOGBOOK_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SECOND_SUPABASE_URL: ${{ vars.ELEVARE_MARKETPLACE_SUPABASE_URL }}
          SECOND_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SECOND_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SECOND_SUPABASE_URL: ${{ vars.ELEVARE_MARKETPLACE_SUPABASE_URL }}
          NEXT_PUBLIC_SECOND_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SECOND_SUPABASE_ANON_KEY }}
